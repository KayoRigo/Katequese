name: Testes e Guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rodar testes e guardrails de arquitetura
        run: node --test testes/*.test.js guardrails/*.test.js
