<!DOCTYPE html>
<html lang="pt-BR" class="carregando">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notificações · Katequese</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../modulos/notificacoes/notificacoes.css">
  <script src="../js/base/tema.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#111214">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

<body>
  <!-- O menu é preenchido pelo menu.js -->
  <header id="menu"></header>

  <main>
    <div class="cabecalho-pagina">
      <div>
        <h1>Notificações</h1>
        <p>Envie um aviso para o celular dos membros. Só aparecem na lista quem ativou as notificações no Perfil.</p>
      </div>
    </div>

    <form class="caixa" id="form-envio">
      <h2>Novo aviso</h2>
      <label class="campo"><span>Título</span>
        <input id="titulo" required maxlength="60" placeholder="Ex: Encontro hoje!"></label>
      <label class="campo"><span>Mensagem</span>
        <textarea id="texto" required rows="3" maxlength="200" placeholder="Ex: Lembrem de levar a camiseta."></textarea></label>

      <fieldset class="bloco-form">
        <legend>Quem recebe</legend>
        <div class="acoes-lista">
          <button class="botao-pequeno" type="button" id="marcar-todos">Marcar todos</button>
          <button class="botao-pequeno" type="button" id="desmarcar-todos">Desmarcar todos</button>
          <span class="suave" id="contagem"></span>
        </div>
        <div class="lista-destino" id="lista-destino"></div>
      </fieldset>

      <p class="mensagem" id="envio-msg"></p>
      <button class="botao" type="submit" id="botao-enviar">Enviar</button>
    </form>

    <section class="caixa">
      <h2>Últimos envios</h2>
      <div id="historico"></div>
    </section>
  </main>

  <footer>Katequese © 2026</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="../js/base/config.js"></script>
  <script src="../js/base/dados.js"></script>
  <script src="../js/base/menu.js"></script>
  <script src="../js/base/banco.js"></script>
  <script src="../js/base/push.js"></script>
  <script type="module" src="../modulos/notificacoes/notificacoes.js"></script>
</body>
</html>
